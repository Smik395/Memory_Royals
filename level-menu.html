<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memory Royals - Levels</title>

    <link
        rel="stylesheet"
        href="css/level-menu.css"
    >
</head>

<body>

    <!-- ==================================================
         BACKGROUND ANIMATION
    =================================================== -->

    <video
        id="backgroundVideo"
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source
            src="assets/videos/background.mp4"
            type="video/mp4"
        >
    </video>


    <!-- Dark transparent layer over background -->
    <div class="background-overlay"></div>


    <!-- ==================================================
         MAIN PAGE
    =================================================== -->

    <main class="level-page">
        <!-- Game Logo -->
        <div class="level-page-logo">
            <img
                src="assets/images/gamelogo.png"
                alt="Memory Royals"
            >
        </div>

        <!-- Page title -->
        <h1 class="page-title">
            Choose Your Level
        </h1>


        <!-- ==================================================
             LEVEL PATH
        =================================================== -->

        <section
            class="level-path-container"
            id="levelPathContainer"
        >

            <!-- Levels will be generated by JavaScript -->

        </section>


        <!-- ==================================================
             BACK BUTTON
        =================================================== -->

        <button
            id="backButton"
            class="back-button"
        >
            ← Back
        </button>

    </main>


    <!-- ==================================================
         AUDIO
    =================================================== -->

    <!-- Background music -->
    <audio
        id="levelMenuMusic"
        preload="auto"
        loop
    >
        <source
            src="assets/audio/home-page.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- Button click sound -->
    <audio
        id="buttonClickSound"
        preload="auto"
    >
        <source
            src="assets/audio/button-click.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script src="js/level-menu.js"></script>

</body>

</html>
