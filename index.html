<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memory Royals - Menu</title>

    <!-- Menu CSS -->
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>

    <video
        id="backgroundVideo"
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source
            src="assets/videos/background.mp4"
            type="video/mp4"
        >

        Your browser does not support video backgrounds.
    </video>


    <!-- ==========================================
         DARK OVERLAY
         Helps the logo and buttons remain visible
    =========================================== -->

    <div class="background-overlay"></div>


    <!-- ==========================================
         MAIN MENU
    =========================================== -->

    <main class="menu-container">

        <!-- Game Logo -->
        <div class="logo-container">
            <img
                src="assets/images/gamelogo.png"
                alt="Memory Royals Logo"
                class="game-logo"
            >
        </div>


        <!-- Menu Buttons -->
        <div class="menu-buttons">

            <!-- Play Button -->
            <button
                id="playButton"
                class="menu-button"
            >
                <span class="button-icon">▶</span>
                <span>Play</span>
            </button>


            <!-- Menu Button -->
            <button
                id="menuButton"
                class="menu-button"
            >
                <span class="button-icon">☰</span>
                <span>Menu</span>
            </button>


            <!-- Rules Button -->
            <button
                id="rulesButton"
                class="menu-button"
            >
                <span class="button-icon">📜</span>
                <span>Rules</span>
            </button>

        </div>

    </main>


    <!-- ==========================================
         AUDIO
    =========================================== -->

    <!-- Background/Menu Music -->
    <audio
        id="menuMusic"
        loop
    >
        <source
            src="assets/audio/home-page.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- Button Click Sound -->
    <audio
        id="buttonClickSound"
    >
        <source
            src="assets/audio/button-click.mp3"
            type="audio/mpeg"
        >
    </audio>


    <!-- Menu JavaScript -->
    <script src="js/menu.js"></script>

</body>
</html>
